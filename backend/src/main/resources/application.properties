spring.application.name=medistock-backend

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/medistock_enterprise
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=8080

# JWT Configuration
medistock.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
medistock.jwt.expiration-ms=86400000

# Enable request logging
logging.level.org.springframework.security=INFO
logging.level.web=INFO
