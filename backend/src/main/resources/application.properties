spring.application.name=backend

# Database — uses environment variable
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME:medistock_db_uqeb_user}
spring.datasource.password=${DB_PASSWORD:AXn96Ad7jEKfrLKOKR0thcRnTycEpMOY}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server Port
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:medistock_secret_key_2024_very_long_secret_key}
jwt.expiration=86400000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Admin email
app.admin.email=${MAIL_USERNAME:your-email@gmail.com}

# Frontend URL
app.frontend.url=${FRONTEND_URL:http://localhost:3000}