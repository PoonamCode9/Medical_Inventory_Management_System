spring.application.name=medistock-backend

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/medistock_enterprise
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=8080

# JWT Configuration
medistock.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
medistock.jwt.expiration-ms=86400000

# Enable request logging
logging.level.org.springframework.security=INFO
logging.level.web=INFO

# Spring Mail SMTP Configuration (configure your email credentials here)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

