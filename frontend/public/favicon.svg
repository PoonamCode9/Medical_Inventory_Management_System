<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark rounded square background -->
  <rect width="64" height="64" rx="14" fill="#0c1428"/>

  <!-- Subtle inner glow border -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- PackageOpen icon (lucide), centered, scaled to fit, color #38bdf8 (sky-400) -->
